<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173d32">
  <title>Page not found | Econite</title>
  <link rel="icon" href="/assests/favicon.ico" type="image/png">
  <style>
    :root {
      color-scheme: light;
      --cream: #f5f5ef;
      --forest: #173d32;
      --green: #216b4b;
      --muted: #626d66;
      --border: #e1e6dd;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      background: var(--cream);
      color: var(--forest);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; }

    a:focus-visible {
      outline: 3px solid var(--green);
      outline-offset: 5px;
    }

    .site-header {
      background: #fff;
      border-bottom: 1px solid var(--border);
    }

    .navbar {
      width: min(1360px, 100%);
      min-height: 88px;
      margin-inline: auto;
      padding: 16px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 13px;
      border-radius: 8px;
      text-decoration: none;
    }

    .brand img {
      display: block;
      width: 48px;
      height: 48px;
      border-radius: 12px;
      object-fit: contain;
    }

    .brand-copy { display: grid; gap: 3px; }
    .brand-name { font-size: 20px; font-weight: 750; letter-spacing: -.6px; }
    .brand-context { color: var(--muted); font-size: 12px; }

    .prototype-tag {
      padding: 7px 11px;
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--muted);
      font-size: 11px;
      white-space: nowrap;
    }

    main {
      width: 100%;
      flex: 1;
      display: grid;
      place-items: center;
      padding: 56px 24px;
    }

    .error-card {
      width: min(100%, 600px);
      padding: 48px 44px;
      text-align: center;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 16px 48px #173d3206;
    }

    .error-number {
      margin: 0 0 12px;
      color: #c8d8cc;
      font-size: clamp(88px, 20vw, 132px);
      font-weight: 750;
      letter-spacing: -.08em;
      line-height: 1;
    }

    .eyebrow {
      margin: 18px 0 12px;
      color: var(--green);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(28px, 5vw, 36px);
      line-height: 1.2;
      letter-spacing: -1.2px;
    }

    .description {
      max-width: 360px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
    }

    .back-link {
      min-height: 48px;
      margin-top: 28px;
      padding: 13px 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 1px solid var(--green);
      border-radius: 11px;
      background: var(--green);
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.5;
      text-decoration: none;
    }

    .back-link:hover { background: var(--forest); border-color: var(--forest); }
    .back-link svg { width: 17px; height: 17px; flex-shrink: 0; }

    footer {
      padding: 0 24px 24px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
      text-align: center;
    }

    @media (max-width: 540px) {
      .navbar { padding: 16px 20px; gap: 12px; }
      .brand { gap: 10px; }
      .brand img { width: 42px; height: 42px; border-radius: 10px; }
      .brand-name { font-size: 18px; }
      .brand-context { font-size: 11px; }
      .prototype-tag { padding: 6px 8px; font-size: 10px; }
      main { padding: 32px 16px; }
      .error-card { padding: 36px 22px; border-radius: 20px; }
      .back-link { width: 100%; }
    }

    @media (max-width: 350px) {
      .navbar { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <nav class="navbar" aria-label="Main navigation">
      <a class="brand" href="/" aria-label="Econite home">
        <img src="/assests/econite-logo.png" alt="" width="48" height="48">
        <span class="brand-copy">
          <span class="brand-name">Econite</span>
          <span class="brand-context">Ideas grow through connection.</span>
        </span>
      </a>
      <span class="prototype-tag">Lab prototype</span>
    </nav>
  </header>

  <main>
    <section class="error-card" aria-labelledby="error-title">
      <p class="error-number" aria-hidden="true">404</p>
      <p class="eyebrow">404 &middot; Page not found</p>
      <h1 id="error-title">A small detour.</h1>
      <p class="description">We couldn&rsquo;t find the page at this address. Check the link, or head back to the consultation chat.</p>
      <a class="back-link" href="/chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10 5-7 7 7 7M3 12h18" /></svg>
        Back to consultation
      </a>
    </section>
  </main>

  <footer>Econite &middot; A space for learning together.</footer>
</body>
</html>
